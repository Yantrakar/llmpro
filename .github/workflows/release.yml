name: Release

# Run it by hand on main: Actions > Release > Run workflow, or
# `gh workflow run release.yml --ref main`. Starting the run is the approval.
# The version in src/agentspro/__init__.py must have a dated section in
# CHANGELOG.md and no tag yet. CI runs on the same commit, then one build
# becomes tag vX.Y.Z and a GitHub release with the wheel, sdist and SHA256SUMS.
#
# PyPI and the MCP Registry are off while the code is private. They run when
# the repository variables PUBLISH_PYPI and PUBLISH_MCP are "true"; see
# docs/releasing.md for what has to be in place first.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Started on main
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version, changelog and tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(python3 -c 'import re,pathlib; print(re.search(r"__version__ = \"(.+)\"", pathlib.Path("src/agentspro/__init__.py").read_text())[1])')
          echo "version=$v"
          grep -Eq "^## $v \([0-9]{4}-[0-9]{2}-[0-9]{2}\)$" CHANGELOG.md || { echo "CHANGELOG.md has no '## $v (YYYY-MM-DD)' section"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" >/dev/null 2>&1; then echo "tag v$v exists"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
      - name: Ready for PyPI
        if: vars.PUBLISH_PYPI == 'true'
        run: |
          name=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["name"])')
          test "$name" = llmpro || { echo "PUBLISH_PYPI is on but the package is named $name, not llmpro"; exit 1; }
      - name: Ready for the MCP Registry
        if: vars.PUBLISH_MCP == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "${{ vars.PUBLISH_PYPI }}" = true || { echo "PUBLISH_MCP needs PUBLISH_PYPI"; exit 1; }
          jq -e --arg v "$VERSION" '.version == $v and ([.packages[].version] | all(. == $v))' server.json
          grep -Fqx "<!-- mcp-name: $(jq -r .name server.json) -->" README.md

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build
      - run: python -m build --outdir dist .
      - run: python tests/smoke_wheel.py dist/*.whl
      - run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          awk -v v="$VERSION" '$0 ~ "^## " v " " {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          cat notes.md
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  pypi:
    needs: github
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmpro/
    permissions:
      id-token: write  # trusted publishing; no token is stored
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    needs: [check, pypi]
    if: vars.PUBLISH_MCP == 'true'
    uses: ./.github/workflows/mcp-registry.yml
    with:
      tag: ${{ needs.check.outputs.tag }}
    permissions:
      contents: read
      id-token: write
