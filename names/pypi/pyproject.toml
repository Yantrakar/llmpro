[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmpro"
version = "0.0.1"
description = "Keep your AI tools' skills, memory and history in one place, and keep secrets and the wrong git identity out of them. Not released yet."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yantrakar" }, { name = "Sandeep Shelke" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://yantrakar.com"

[project.scripts]
llmpro = "llmpro:main"
