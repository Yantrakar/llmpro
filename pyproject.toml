[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmpro"
dynamic = ["version"]
description = "Keep AI assistant chats, memories and instructions in one git repo, with secrets redacted and checked."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yantrakar" }, { name = "Sandeep Shelke" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["ai", "llm", "claude-code", "copilot", "codex", "opencode", "memory", "secrets", "mcp"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]

[project.urls]
Source = "https://github.com/Yantrakar/llmpro"
Issues = "https://github.com/Yantrakar/llmpro/issues"
Changelog = "https://github.com/Yantrakar/llmpro/blob/main/CHANGELOG.md"

[project.optional-dependencies]
git = ["gitpro>=0.4,<0.6"]
test = ["pytest"]

[project.entry-points."llmpro.plugins"]
memory = "llmpro.plugins.memory:plugin"
secrets = "llmpro.plugins.secrets:plugin"
git = "llmpro.plugins.git:plugin"

[project.scripts]
llmpro = "llmpro.cli:main"

[tool.hatch.version]
path = "src/llmpro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmpro"]

[tool.hatch.build.targets.wheel.force-include]
"skills/llmpro" = "llmpro/skills/llmpro"

[tool.hatch.build.targets.sdist]
only-include = ["src/llmpro", "skills/llmpro", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
