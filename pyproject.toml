[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmpro"
dynamic = ["version"]
description = "Keep AI assistant chats, memories and instructions in one git repo, with secrets redacted and checked."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
git = ["gitpro>=0.4,<0.6"]
test = ["pytest"]

[project.entry-points."llmpro.plugins"]
memory = "llmpro.plugins.memory:plugin"
secrets = "llmpro.plugins.secrets:plugin"
git = "llmpro.plugins.git:plugin"

[project.scripts]
llmpro = "llmpro.cli:main"
agentspro = "llmpro.cli:alias_main"

[tool.hatch.version]
path = "src/llmpro/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/llmpro"]

[tool.hatch.build.targets.wheel.force-include]
"skills/llmpro" = "llmpro/skills/llmpro"

[tool.hatch.build.targets.sdist]
exclude = ["names", ".github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
