# Settings for llmpro. Change them here, not in the code.
# Paths may start with ~. A folder that does not exist on this machine is ignored.

[store]
format = 1
redact_version = 1

[harness]
# The parts of the harness this store holds: what every assistant loads. Paths are inside the store.
# llmpro setup -n shows which tools get each part, and setup links each part into the tools that load it.
instructions = "AGENTS.md"   # the entry file every assistant reads
memory = "memory/"           # one fact per file
skills = "skills/"           # every skill, the only copy
subagents = "agents/"        # helper agents, one folder per tool: agents/<tool>/
hooks = "hooks/"             # commands a tool runs on its events, one folder per tool: hooks/<tool>/
guardrails = "guardrails/"   # hooks that stop an assistant: guardrails/claude-code/
scripts = "scripts/"         # commands for every assistant and for you; setup puts them on PATH

[privacy]
# Chats whose source file or working folder lies under one of these folders are imported into local/,
# which git ignores: they stay on this machine and are never committed or sent to the hub.
# Adding a folder affects new imports only: move that project's existing chats from history/ to
# local/history/ (and their rows from manifest.jsonl to local/manifest.jsonl) by hand.
local_only = []
# Or keep chats local by git identity, without listing folders: every chat whose project folder is a repo
# that gitpro places under one of these identities (ids from gitpro.toml; "default" is the default
# identity) stays in local/. Needs gitpro 0.4 or later. If gitpro cannot place a folder, its chats stay
# local. Chats that are already shared stay where they are; sync lists them so you can move them by hand.
# local_identities = ["work"]

[sources]
# Project-local tool folders (a project that sets its own CODEX_HOME or CLAUDE_CONFIG_DIR), read in
# addition to ~/.codex and ~/.claude. Their credential files are never opened.
codex_extra = []
claude_extra = []

[redact]
# Words the redactor must never treat as secrets, besides the login name and short hostname, which are
# added automatically.
never_sweep = []

[instructions]
# Instruction files to copy in addition to the standard ones: [["tool", "path"], ...]
extra = []
# The same with glob patterns.
extra_globs = []
# Files to record as skipped: [["tool", "kind", "path", "reason"], ...]
skip = []
